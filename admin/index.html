<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#users">Users</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#orders">Orders</a></li>
            <li><a href="#settings">Settings</a></li>
        </ul>
    </div>
    <div class="main-content">
        <header>
            <h1>Dashboard</h1>
        </header>
        <section id="dashboard">
            <h2>Welcome, Admin</h2>
            <div class="stats">
                <div class="stat">Users: <span id="user-count">0</span></div>
                <div class="stat">Products: <span id="product-count">0</span></div>
                <div class="stat">Orders: <span id="order-count">0</span></div>
            </div>
        </section>
        <section id="users">
            <h2>Users</h2>
            <table id="user-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- User data will be populated here -->
                </tbody>
            </table>
        </section>
        <section id="products">
            <h2>Products</h2>
            <table id="product-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Product data will be populated here -->
                </tbody>
            </table>
        </section>
        <section id="orders">
            <h2>Orders</h2>
            <table id="order-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Order data will be populated here -->
                </tbody>
            </table>
        </section>
        <section id="settings">
            <h2>Settings</h2>
            <!-- Settings content -->
        </section>
    </div>
</body>
</html>
